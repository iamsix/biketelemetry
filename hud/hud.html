<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <!-- <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=elevation,speed" /> -->
    <style>
        body {
            background: transparent;
            overflow: hidden;
            font-family: 'Arial Black', sans-serif;
        }

        /* The Map HUD Container */
        #hud-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 300px;
            height: 300px;
            border: 5px solid #fff;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            /* Make 50% for circular GTA IV style */
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Stats Overlay */
        #stats {
            position: absolute;
            bottom: 20px;
            left: 340px;
            width: 130px;
            color: white;
            text-shadow: 2px 2px #000;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
        }

        #weather-panel {
            position: absolute;
            left: 20px;
            bottom: 320px;
            width: 180px;
            z-index: 10;
            color: white;
            text-shadow: 2px 2px #000;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px;
            border-radius: 10px 10px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        #weather-panel span {
            display: inline-block;
            vertical-align: middle;
        }

        .weather-icon {
            font-size: 1.2em;
            width: 1.2em;
            text-align: center;
        }

        .weather-info {
            flex: 1;
            white-space: normal;
            overflow: visible;
            text-overflow: unset;
            font-size: 0.95em;
        }

        .wind-info {
            font-size: 0.95em;
            min-width: 48px;
            text-align: right;
        }

        .stale-badge {
            display: none;
            margin-left: 6px;
            background: rgba(255, 165, 0, 0.95);
            color: #000;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9em;
        }
    </style>
</head>

<body>

    <div id="hud-container">
        <div id="map"></div>
    </div>
    <div id="stats">
        <!-- sync_problem to show stale data? -->
        <!-- <span class="material-symbols-outlined">
                speed
            </span> -->
        <div id="speed"><span class="metric-value">0 KM/H</span> <span class="stale-badge"
                data-metric-key="speed_kmh">⚠️</span></div>
        <!-- bolt_boost -->
        <div id="power"><span class="metric-value">PWR: 0 W</span> <span class="stale-badge"
                data-metric-key="power">⚠️</span></div>
        <!-- probably 'cycle' ?? or 'cadence' but not sure.. -->
        <div id="cadence"><span class="metric-value">CAD: 0 rpm</span> <span class="stale-badge"
                data-metric-key="cadence">⚠️</span></div>
        <!-- cardiology -->
        <div id="heart_rate"><span class="metric-value">HR: 0 bpm</span> <span class="stale-badge"
                data-metric-key="heart_rate">⚠️</span></div>
        <!-- straighten maybe? timeline? -->
        <div id="dist">DIST: 0m</div>
        <!-- <span class="material-symbols-outlined">
            elevation
        </span> -->
        <div id="climb"><span class="metric-value">CLIMB: 0m</span> <span class="stale-badge"
                data-metric-key="elevation_m">⚠️</span></div>
        <!-- altitude for grade%? or maybe tools_level or square_foot, or switch climbg/grade -->
        <div id="grade"><span class="metric-value">GR: 0%</span> <span class="stale-badge"
                data-metric-key="elevation_m">⚠️</span></div>
    </div>
    <div id="weather-panel">
        <span class="weather-icon">🌡️</span>
        <span class="weather-info">--</span>
        <span class="wind-info">--</span>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>

        // Update per-metric stale badges using backend-provided flags
        function updatePerMetricStale(flags) {
            document.querySelectorAll('.stale-badge').forEach(el => {
                const key = el.dataset.metricKey;
                const isStale = flags && (flags[key] === true);
                el.style.display = isStale ? 'inline-block' : 'none';
            });
        }

        const map = L.map('map', { zoomControl: false }).setView([0, 0], 13);

        // Use OpenCycleMap or standard OSM
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OSM'
        }).addTo(map);

        let trackLine = L.polyline([], { color: '#00008B', weight: 4 }).addTo(map);
        // TODO: Custom marker cycling
        let marker = L.marker([0, 0], {}).addTo(map);

        // --- Dynamic Zoom Logic ---
        let zoomLevels = [11, 13, 15]; // 1km-ish to 10km-ish
        let delayTime = [15000, 15000, 30000];
        let zoomIdx = 0;

        function scheduleZoomChange() {
            setTimeout(() => {
                zoomIdx = (zoomIdx + 1) % zoomLevels.length;
                map.setZoom(zoomLevels[zoomIdx], { animate: true });
                scheduleZoomChange(); // Schedule next change with correct delay
            }, delayTime[zoomIdx]);
        }
        scheduleZoomChange();

        // Fetch weather (cached server-side) and update HUD. Runs hourly.
        function iconToEmoji(icon) {
            switch (icon) {
                case 'clear-day': return '☀️';
                case 'clear-night': return '🌕';
                case 'rain': return '🌧️';
                case 'snow': return '❄️';
                case 'sleet': return '🌨️';
                case 'wind': return '🌬️';
                case 'fog': return '🌫️';
                case 'cloudy': return '☁️';
                case 'partly-cloudy-day': return '⛅';
                case 'partly-cloudy-night': return '🌥️';
                case 'hail': return '🌨️';
                case 'thunderstorm': return '⛈️';
                case 'tornado': return '🌪️';
                default: return '🌡️';
            }
        }

        function bearingToArrow(bearing) {
            if (bearing == null || isNaN(bearing)) return '↗';
            const arrows = ['↑', '↗', '→', '↘', '↓', '↙', '←', '↖'];
            return arrows[Math.floor(((bearing % 360) + 360) / 45) % 8];
        }

        async function fetchWeather() {
            try {
                const res = await fetch('/api/v1/weather');
                const data = await res.json();
                const cur = data.currently || data.current || {};
                const temp = cur.temperature ?? cur.temp ?? null;
                const icon = cur.icon || data.icon || null;
                const windSpeed = cur.windSpeed ?? cur.wind_speed ?? null;
                const windBearing = cur.windBearing ?? cur.wind_bearing ?? null;
                const emoji = iconToEmoji(icon);
                const arrow = bearingToArrow(windBearing);
                const weatherText = temp !== null ? `${Math.round(temp)}°C` : (data.error ? '--' : '--');
                const windText = windSpeed !== null ? `${arrow} ${Math.round(windSpeed)} km/h` : '--';
                document.querySelector('#weather-panel .weather-icon').innerText = emoji;
                document.querySelector('#weather-panel .weather-info').innerText = weatherText;
                document.querySelector('#weather-panel .wind-info').innerText = windText;
            } catch (e) {
                document.querySelector('#weather-panel .weather-icon').innerText = '🌡️';
                document.querySelector('#weather-panel .weather-info').innerText = '--';
                document.querySelector('#weather-panel .wind-info').innerText = '--';
            }
        }

        async function updateDashboard() {
            const res = await fetch('/api/v1/session');
            const data = await res.json();

            if (data.points.length > 0) {
                const lastPoint = data.points[data.points.length - 1];

                // Update Map
                trackLine.setLatLngs(data.points);
                marker.setLatLng(lastPoint);
                map.panTo(lastPoint);

                // Update Stats
                const metrics = data.last_metrics.metrics || {};
                document.querySelector('#speed .metric-value').innerText = `${metrics.speed_kmh ?? 0} KM/H`;
                document.querySelector('#heart_rate .metric-value').innerText = `HR: ${metrics.heart_rate?.toFixed(0) ?? 0} bpm`;
                document.querySelector('#power .metric-value').innerText = `PWR: ${metrics.power ?? 0} W`;
                document.querySelector('#cadence .metric-value').innerText = `CAD: ${metrics.cadence ?? 0} rpm`;
                document.querySelector('#climb .metric-value').innerText = `CLIMB: ${data.total_climb_m.toFixed(0)}m`;
                document.querySelector('#grade .metric-value').innerText = `GR: ${metrics.grade_percent?.toFixed(0) ?? 0}%`;
                const distMeters = data.total_distance_m ?? 0;
                const distText = distMeters < 1000
                    ? `DIST: ${distMeters.toFixed(0)}m`
                    : `DIST: ${(distMeters / 1000).toFixed(1)}km`;
                document.getElementById('dist').innerText = distText;

                // Use backend-provided per-metric stale flags if available
                const metricFlags = data.last_metrics?.metrics_stale || null;
                if (metricFlags) {
                    updatePerMetricStale(metricFlags);
                }
            }
        }

        // Update every 4 seconds
        setInterval(updateDashboard, 4000);
        updateDashboard(); // Initial call
        // Weather: fetch immediately and then hourly
        fetchWeather();
        setInterval(fetchWeather, 60 * 60 * 1000);
    </script>

</body>

</html>
